  <meta charset="utf-8" />

  <title>Takehome assignment for Impact.com</title>

  <style>
    :root{
      --accent:#0366d6;
      --muted:#6b7280;
      --card:#ffffff;
      --bg:#0f172a;
      --maxw:720px;
      --radius:10px;
      --gap:18px;
    }
    html,body{height:100%; margin:0; padding:0;}
    body{
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:var(--bg); color:#e6eef8; -webkit-font-smoothing:antialiased;
      line-height:1.45; overflow-x:hidden;
    }
    #bg-canvas {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:0;
      display:block;
      background: linear-gradient(180deg, #071029 10%, #07101a 60%, #08122a 100%);
      pointer-events: none;
    }
    .wrap{
      position:relative;
      z-index:2;
      max-width:var(--maxw);
      margin:28px auto;
      padding:28px;
      background:#0b1220;
      border-radius:var(--radius);
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.04);
      min-height: calc(100vh - 56px);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .card{
      width:100%;
      max-width:420px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:8px;
      padding:22px;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.03);
    }
    h1{margin:0; font-size:1.6rem; color:#e6eef8;}
    .meta{font-size:0.95rem; color:#b7c3d3; margin-top:8px;}
    .price{font-size:1.3rem; font-weight:700; margin-top:10px; color:#dfe9f8;}
    button{
      appearance:none;
      border:0;
      background:var(--accent);
      color:white;
      padding:10px 14px;
      border-radius:8px;
      cursor:pointer;
      font:inherit;
      margin-top:16px;
      box-shadow:0 8px 20px rgba(3,102,214,0.25);
    }
    button:active{transform:translateY(1px);}
    .small{font-size:0.86rem; color:#b7c3d3; margin-top:10px;}
    .status{margin-top:12px; font-size:0.9rem; color:#cfe6ff; min-height:1.3em;}
    .hidden-note{display:none;}
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WD5F24WR"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- My new by-hand work starts here -->
  <div class="wrap" role="main">
    <section class="card" aria-label="Product test area">	  
      <h1 id="product-name">Super Widget</h1>
      <div class="price">$<span id="product-price">19.99</span></div>
      <button id="send-btn" type="button">Send product to httpbin</button>
      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </div>
  
  <!-- GTM/GA4 event -->
  <script>
    window.dataLayer = window.dataLayer || [];

    window.addEventListener('load', function () {
      var nameEl = document.getElementById('product-name');
      var priceEl = document.getElementById('product-price');

      var productName = nameEl ? nameEl.textContent.trim() : '';
      var productPrice = priceEl ? parseFloat(priceEl.textContent) : 0;

      window.dataLayer.push({
        event: 'product_view',
        product_name: productName,
        product_price: productPrice
      });
    });
  </script>

<!-- Post request logic -->
  <script>
    //get the elements from the page
    var productName = document.getElementById('product-name');
    var productPrice = document.getElementById('product-price');
    var button = document.getElementById('send-btn');
    var status = document.getElementById('status');

    //send the data to httpBin and listen for response
    button.addEventListener('click', function () {
      status.textContent = 'Sending request...';

      fetch('https://httpbin.org/post', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json; charset=UTF-8'
        },
        body: JSON.stringify({
          product_name: productName.textContent,
          product_price: parseFloat(productPrice.textContent)
        })
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          status.textContent = 'Done! Check the console for the response output.';
          console.log(data);
        });
    });
  </script>
  <!-- My new by-hand work ends here -->
</body>
</html>
